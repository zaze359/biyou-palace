services:
  new-api:
    image: ${NEWAPI_IMAGE:-calciumion/new-api:v1.0.0-rc.48}
    container_name: ${NEWAPI_CONTAINER_NAME:-new-api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEWAPI_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    env_file:
      # 由 scripts/bootstrap_cluster.sh 生成；缺失时仍可解析配置（NewAPI 使用内置默认值）
      - path: ./conf/new-api.env
        required: false
    volumes:
      - ${NEWAPI_DATA_DIR:-./data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
