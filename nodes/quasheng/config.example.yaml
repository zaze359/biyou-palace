# 准圣节点智能体配置示例
# 优先级：环境变量（QUASHENG_*）> 本文件 > 默认值
# 使用：复制为 config.yaml，或设置 QUASHENG_CONFIG=/path/to/config.yaml

# 默认只监听回环地址。要对外提供服务，必须同时配置 shared_token，
# 否则节点会拒绝启动（避免裸推理端点暴露到局域网/公网）。
host: "127.0.0.1"
ollama_base: "http://127.0.0.1:11434"
port: 4010                     # 避开 Ollama 自身的 11434
node_id: "quasheng-01"
node_name: "准圣·01"

# 鉴权：配置了 shared_token 即自动开启（也可显式写 auth_enabled: true）
shared_token: ""
auth_enabled: false

# 启动即预热常驻的模型 —— 消除"首次请求阻塞 30s+"
# 名称必须与 `ollama list` 完全一致（含 :tag）；不存在的模型会被跳过，
# 不会让 /v1/health 长期停留在 loading。
preload_models:
  - "qwen2.5:7b-instruct-q4_K_M"

# 能力声明。**未登记的模型默认只有 ["chat"]**——
# 能力必须显式声明，不声明就不会被路由到（embeddings 会直接 501）。
# 键名同样是 `ollama list` 里的真实名称：`ollama pull nomic-embed-text`
# 落库后的名字带 `:latest`，这里必须写全，否则精确匹配失败会被当成 chat-only。
capabilities_map:
  "qwen2.5:7b-instruct-q4_K_M":
    capabilities: ["chat"]
    context_len: 32768
  "nomic-embed-text:latest":
    capabilities: ["embedding"]
    context_len: 8192

# 并发闸门：满载立即 429 + Retry-After（不做本地排队）。
# 契约四章建议准圣（PC）≥ 4。
max_concurrency: 4

# degraded 判定阈值
mem_warn_pct: 85
cpu_warn_pct: 90

request_timeout: 300

# 优雅停机：SIGTERM/SIGINT 后等待在途请求结束的最长秒数
shutdown_timeout: 10

# ---------------------------------------------------------------------------
# 外部上游（可选：静态清单 + 动态发现；默认整段注释掉 = 行为与未接入时完全一致）
#
# 远程模型对外 id 为 <provider>/<model>；本地模型 id 不变。
# 密钥只从 api_key_env 指向的环境变量读取（缺失时节点拒绝启动并提示变量名）。
# 出网提示：data_leaves_lan=true 会在启动日志与 health 中明示 prompt 会离开局域网；
# 上游请求遵循 HTTP(S)_PROXY，本地 Ollama 仍强制直连。
# P1 边界：不做多上游聚合、跨上游回退、用量计费、上游 embeddings；
# 动态发现只做「上游 /v1/models ∩ 白名单」，不做能力探测。
# ---------------------------------------------------------------------------
# upstreams:
#   - id: relay-a                 # provider id，同时是远程模型 id 前缀
#     base_url: https://relay.example.com/v1
#     enabled: true               # 默认 false
#     api_key_env: QUASHENG_UPSTREAM_RELAY_A_KEY
#     connect_timeout_s: 10
#     timeout_s: 120
#     max_concurrency: 4          # 单上游独立名额，满载立即 429（不排队）
#     visibility: local           # local | cluster | both
#     data_leaves_lan: true
#     discover: false             # true 时按上游 /v1/models 动态发现
#     discover_interval_s: 300    # 发现间隔，下限 60 秒
#     models:                     # discover=true 时可留空 = 不设白名单（暴露全部）
#       - id: gpt-4o-mini
#         capabilities: [chat]
#         context_len: 128000
#
# 回退策略（可选；不配置时行为与未接入时完全一致）
# manual：不切换，仅在可回退类错误体里追加候选提示；
# auto：按链顺序尝试，仅兜连接失败/超时/5xx，4xx 与 401/403 不兜。
# fallback_source：static（默认，只用下面的 fallback_chain）或 registry
# （查阵图 /zhentu/v1/candidates，只保留 newapi 上游快照中存在的模型，
#  仍经 newapi 网关执行；查询失败/无候选时自动退回 fallback_chain）。
# fallback_source: static
# fallback_mode: manual
# fallback_chain:
#   - newapi/qwen2.5:0.5b        # 远程：<provider>/<model>
#   - local/qwen2.5:0.5b         # 本地：local/<model>（local 为保留前缀）
#
# 可观测性（可选）：结构化事件落盘；留空则只保留内存环形缓冲（/v1/logs）
# log_file: "/var/log/quasheng/events.jsonl"
# log_max_bytes: 10485760       # 单文件上限，默认 10 MiB
# log_backup_count: 3           # 轮转保留份数，0 表示不保留

# ---------------------------------------------------------------------------
# 阵图注册与心跳（可选；默认关闭 = 行为与未接入时完全一致）
#
# 节点只做出站注册/心跳，不新增任何入站端点；阵图不可达只影响注册视图，
# 不影响启动耗时、本地 chat/embeddings/health 与节点状态。
# token 只从 token_env 指向的环境变量读取，不写进本文件。
# ---------------------------------------------------------------------------
# registry:
#   enabled: false
#   base_url: "http://127.0.0.1:4020"   # 阵图 Registry 旁路服务
#   token_env: "ZHENTU_REGISTRY_TOKEN"  # 集群级 Bearer token 的变量名
#   heartbeat_interval_s: 15            # 10..120；registry 侧按 3x 计算租约
#   public_endpoint: ""                 # 空则按 host:port 推导；监听 0.0.0.0 时建议显式填写
#   timeout_s: 3
#
# 使用 fallback_source: registry 时必须 registry.enabled: true；
# 候选查询复用上面的 base_url 与 token，单次超时固定 300ms、结果缓存 10s。
