[versions]
agp = "8.7.0"
kotlin = "2.1.0"
composeMultiplatform = "1.7.3"
coroutines = "1.9.0"
androidxLifecycle = "2.8.4"
androidxActivity = "1.9.3"
androidxAppCompat = "1.7.0"
work = "2.9.1"
datastore = "1.1.1"
zxing = "3.5.3"

[libraries]
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
# 注意：*-compose 使用 JetBrains KMP 多平台坐标（org.jetbrains.androidx.lifecycle），
# 同时提供 Android 与 iOS 变体；Jetpack 版（androidx.lifecycle）无 Kotlin/Native 变体，
# 会导致 iOS target 解析失败。lifecycle-runtime-ktx 仍用 Jetpack 版（仅 Android）。
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppCompat" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
# 设备端配置：DataStore Preferences（端口/token/并发/模型等运行时可改，无需重打包）
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# 首页访问二维码：仅本地编码，不走网络（core 为纯 Java 实现）
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# Compose (BOM 由 composeMultiplatform 插件统一管理，这里仅声明模块)
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.3" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
